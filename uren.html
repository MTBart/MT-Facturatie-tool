<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2A4A38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>M&T Uren</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@400;500&family=Figtree:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F0;--surface:#FDFCF9;--surface2:#F2EFE8;
  --border:#E2DDD4;--border-strong:#C8C0B0;
  --text:#1C1A16;--text-dim:#6B6455;--text-faint:#A8A090;
  --gold:#B8962E;--gold-light:#FBF5E0;--gold-mid:#E8D48A;
  --green:#2A4A38;--green-light:#E6EFE9;--green-mid:#4A7A5C;
  --red:#8B1A1A;--red-light:#FDE8E8;
  --blue:#1a3a8b;--blue-light:#E8EDFB;
  --purple:#5a3a8b;--purple-light:#F0EDFB;
  --orange:#8B4513;--orange-light:#FDF0E8;
  --mono:'DM Mono',monospace;--serif:'Fraunces',serif;--sans:'Figtree',sans-serif;
  --radius:10px;--shadow:0 2px 16px rgba(44,40,28,0.08);--shadow-lg:0 8px 40px rgba(44,40,28,0.14);
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.55;overscroll-behavior:none}

header{background:linear-gradient(135deg,var(--green) 0%,#1e3829 60%,#162d20 100%);color:#F7F5F0;padding:0 1.25rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.2)}
.header-left{display:flex;align-items:baseline;gap:0.6rem}
header h1{font-family:var(--serif);font-size:18px;font-weight:400;letter-spacing:0.02em}
header h1 span{color:var(--gold-mid);font-style:italic}
.header-version{font-family:var(--mono);font-size:10px;opacity:0.4}
.header-right{display:flex;align-items:center;gap:0.75rem}
.user-chip{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:4px 12px;font-size:12px;font-family:var(--mono);cursor:pointer;transition:background 0.15s}
.user-chip:hover{background:rgba(255,255,255,0.25)}
.icon-btn{background:none;border:none;cursor:pointer;color:#F7F5F0;opacity:0.7;font-size:18px;padding:4px;line-height:1;transition:opacity 0.15s}
.icon-btn:hover{opacity:1}

.tabs-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.25rem;display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tab-btn{padding:13px 16px;border:none;background:none;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--text-faint);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.18s;white-space:nowrap}
.tab-btn:hover{color:var(--text-dim)}
.tab-btn.active{color:var(--green);border-bottom-color:var(--gold);font-weight:600}
.tab-content{display:none}
.tab-content.active{display:block}
.main{padding:1.25rem;max-width:100%}

/* ── TIMER TAB ── */
.running-bar{background:var(--green);color:#fff;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.running-bar.hidden{display:none}
.running-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.running-project{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.running-desc{font-size:12px;opacity:0.75}
.running-right{display:flex;align-items:center;gap:0.75rem;flex-shrink:0}
.running-clock{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:0.05em}
.pulse{width:10px;height:10px;border-radius:50%;background:#4caf50;box-shadow:0 0 0 0 rgba(76,175,80,0.4);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,175,80,0.5)}70%{box-shadow:0 0 0 8px rgba(76,175,80,0)}100%{box-shadow:0 0 0 0 rgba(76,175,80,0)}}
.stop-btn{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.35);border-radius:8px;color:#fff;font-family:var(--sans);font-weight:600;font-size:13px;padding:8px 16px;cursor:pointer;transition:background 0.15s;white-space:nowrap}
.stop-btn:hover{background:rgba(255,255,255,0.3)}

.timer-section{padding:1.25rem}
.section-label{font-family:var(--mono);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-faint);margin-bottom:0.75rem}
.project-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0.6rem}
.project-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:1rem 1rem 0.85rem;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden}
.project-card:hover,.project-card:active{border-color:var(--green-mid);background:var(--green-light);transform:translateY(-1px);box-shadow:var(--shadow)}
.project-card-code{font-family:var(--mono);font-size:11px;color:var(--gold);font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-card-naam{font-size:13px;font-weight:500;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.project-card-uren{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:6px}
.project-card.actief{border-color:var(--green);background:var(--green-light)}
.project-card.actief::after{content:'▶';position:absolute;bottom:8px;right:10px;font-size:10px;color:var(--green)}
.no-projects{padding:2rem;text-align:center;color:var(--text-faint);font-size:13px}

.desc-bar{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:0.75rem 1.25rem;display:flex;gap:0.75rem;align-items:center}
.desc-bar.hidden{display:none}
.desc-input{flex:1;padding:8px 11px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;outline:none}
.desc-input:focus{border-color:var(--green-mid)}
.desc-save{background:var(--green);color:#fff;border:none;border-radius:6px;padding:8px 14px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer}

/* ── DAG TAB ── */
.dag-header{display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;flex-wrap:wrap}
.dag-nav{display:flex;align-items:center;gap:0.5rem}
.dag-nav button{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;font-family:var(--sans);color:var(--text-dim);transition:all 0.15s}
.dag-nav button:hover{border-color:var(--green-mid);color:var(--green)}
.dag-datum{font-family:var(--serif);font-size:18px;font-weight:300;color:var(--text)}
.dag-input{padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px;outline:none;cursor:pointer}
.dag-input:focus{border-color:var(--green-mid)}
.teamlid-blok{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:0.75rem;overflow:hidden;box-shadow:var(--shadow)}
.teamlid-header{display:flex;align-items:center;justify-content:space-between;padding:0.85rem 1rem;border-bottom:1px solid var(--border);gap:0.5rem}
.teamlid-naam{display:flex;align-items:center;gap:0.6rem;font-weight:600;font-size:14px}
.teamlid-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.teamlid-totaal{font-family:var(--mono);font-size:13px;color:var(--text-dim)}
.teamlid-add{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text-faint);font-family:var(--sans);transition:all 0.15s}
.teamlid-add:hover{border-color:var(--green-mid);color:var(--green)}
.entries-lijst{padding:0.5rem 0}
.entry-row{display:flex;align-items:center;gap:0.75rem;padding:0.5rem 1rem;border-bottom:1px solid var(--border);transition:background 0.12s}
.entry-row:last-child{border-bottom:none}
.entry-row:hover{background:var(--surface2)}
.entry-tijd{font-family:var(--mono);font-size:12px;color:var(--text-faint);flex-shrink:0;width:90px}
.entry-project{font-family:var(--mono);font-size:11px;color:var(--gold);font-weight:500;flex-shrink:0;width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-desc{font-size:13px;color:var(--text-dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-duur{font-family:var(--mono);font-size:12px;color:var(--text);font-weight:500;flex-shrink:0;width:48px;text-align:right}
.entry-actions{display:flex;gap:4px;flex-shrink:0}
.entry-btn{background:none;border:none;cursor:pointer;color:var(--text-faint);font-size:13px;padding:3px;border-radius:4px;transition:all 0.12s}
.entry-btn:hover{background:var(--surface2);color:var(--text)}
.entry-btn.del:hover{background:var(--red-light);color:var(--red)}
.geen-entries{padding:1rem 1rem;font-size:13px;color:var(--text-faint);font-style:italic}

/* ── PLANNING TAB ── */
.planning-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem}
.week-label{font-family:var(--serif);font-size:18px;font-weight:300}
.week-nav{display:flex;gap:0.5rem}
.week-nav button{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;font-family:var(--sans);color:var(--text-dim);transition:all 0.15s}
.week-nav button:hover{border-color:var(--green-mid);color:var(--green)}
.week-grid{display:grid;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.week-col-headers{display:grid;border-bottom:1px solid var(--border);background:var(--surface2)}
.week-col-header{padding:0.6rem 0.5rem;font-size:11px;font-family:var(--mono);font-weight:500;color:var(--text-faint);text-align:center;border-right:1px solid var(--border)}
.week-col-header:last-child{border-right:none}
.week-col-header.dag-header-cel{color:var(--text-dim);font-size:12px}
.week-row{display:grid;border-bottom:1px solid var(--border)}
.week-row:last-child{border-bottom:none}
.week-dag-label{padding:0.6rem 0.75rem;font-size:12px;font-family:var(--mono);color:var(--text-dim);background:var(--surface2);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.week-dag-dag{font-weight:500;color:var(--text)}
.week-dag-datum{font-size:10px;color:var(--text-faint)}
.week-cel{padding:0.4rem;border-right:1px solid var(--border);min-height:60px;cursor:pointer;transition:background 0.12s;vertical-align:top;position:relative}
.week-cel:last-child{border-right:none}
.week-cel:hover{background:var(--green-light)}
.week-cel.weekend{background:var(--surface2)}
.week-cel.weekend:hover{background:var(--green-light)}
.plan-blok{background:var(--green-light);border:1px solid var(--green-mid);border-radius:6px;padding:3px 6px;margin-bottom:3px;font-size:11px;cursor:pointer;position:relative}
.plan-blok-code{font-family:var(--mono);color:var(--green);font-weight:500;font-size:10px}
.plan-blok-uren{font-family:var(--mono);color:var(--text-dim);font-size:10px}
.plan-blok-del{position:absolute;top:2px;right:4px;background:none;border:none;cursor:pointer;color:var(--text-faint);font-size:11px;padding:0;line-height:1}
.plan-blok-del:hover{color:var(--red)}
.plan-realisatie{background:var(--blue-light);border:1px solid #90a4d4;border-radius:6px;padding:3px 6px;margin-bottom:3px;font-size:10px;font-family:var(--mono);color:var(--blue)}

/* ── PROJECTEN TAB ── */
.filter-row{display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.periode-btn{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;font-family:var(--sans);cursor:pointer;color:var(--text-dim);transition:all 0.15s}
.periode-btn:hover,.periode-btn.active{background:var(--green-light);border-color:var(--green-mid);color:var(--green)}
.project-rapport-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:0.6rem;cursor:pointer;transition:all 0.15s;box-shadow:var(--shadow)}
.project-rapport-item:hover{border-color:var(--green-mid)}
.pr-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem}
.pr-code{font-family:var(--mono);font-size:12px;color:var(--gold);font-weight:500}
.pr-naam{font-size:13px;color:var(--text-dim)}
.pr-totaal{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--text)}
.pr-bar-wrap{height:6px;background:var(--surface2);border-radius:3px;margin-bottom:0.5rem;overflow:hidden}
.pr-bar{height:6px;border-radius:3px;background:var(--green-mid);transition:width 0.4s}
.pr-breakdown{display:flex;gap:0.75rem;flex-wrap:wrap}
.pr-persoon{display:flex;align-items:center;gap:4px;font-size:11px;font-family:var(--mono);color:var(--text-faint)}
.pr-persoon-dot{width:8px;height:8px;border-radius:50%}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(28,26,22,0.5);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
@media(min-width:600px){.modal-overlay{align-items:center}}
.modal{background:var(--surface);border-radius:16px 16px 0 0;padding:1.5rem;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
@media(min-width:600px){.modal{border-radius:var(--radius)}}
.modal-title{font-family:var(--serif);font-size:20px;font-weight:300;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-faint);padding:2px}
.form-row{margin-bottom:1rem}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--text-faint);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.06em}
.form-input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;outline:none}
.form-input:focus{border-color:var(--green-mid)}
.form-select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;outline:none;cursor:pointer}
.btn{padding:9px 18px;border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-mid)}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--text-dim)}
.btn-secondary:hover{border-color:var(--green-mid);color:var(--green)}
.btn-danger{background:var(--red-light);border:1px solid var(--red);color:var(--red)}
.btn-sm{padding:6px 12px;font-size:12px}
.modal-actions{display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.25rem}

/* ── INSTELLINGEN ── */
.inst-sectie{margin-bottom:1.5rem}
.inst-sectie-title{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-faint);margin-bottom:0.75rem;padding-bottom:0.4rem;border-bottom:1px solid var(--border)}
.teamlid-rij{display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0;border-bottom:1px solid var(--border)}
.teamlid-rij:last-child{border-bottom:none}
.tl-kleur{width:20px;height:20px;border-radius:50%;flex-shrink:0;cursor:pointer;border:2px solid transparent;transition:border-color 0.15s}
.tl-kleur:hover{border-color:var(--border-strong)}
.tl-naam-inp{flex:1;padding:6px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-family:var(--sans);font-size:13px;color:var(--text);outline:none}
.tl-rol{padding:5px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:12px;font-family:var(--sans);color:var(--text-dim);cursor:pointer}

/* ── WELKOM SCHERM ── */
.welkom{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:2rem;text-align:center;gap:1rem}
.welkom-title{font-family:var(--serif);font-size:28px;font-weight:300;color:var(--text)}
.welkom-title span{color:var(--gold);font-style:italic}
.welkom-sub{color:var(--text-faint);font-size:14px;max-width:320px}
.naam-knoppen{display:flex;flex-direction:column;gap:0.6rem;width:100%;max-width:280px}
.naam-knop{padding:14px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface);font-family:var(--sans);font-size:15px;font-weight:500;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:0.75rem}
.naam-knop:hover{border-color:var(--green-mid);background:var(--green-light);color:var(--green)}
.naam-knop-dot{width:12px;height:12px;border-radius:50%}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  .project-cards{grid-template-columns:repeat(2,1fr)}
  .entry-project{width:100px}
  .entry-row{padding:0.5rem 0.75rem}
  .week-grid{font-size:10px}
  .pr-breakdown{gap:0.5rem}
}
@media(min-width:900px){
  .project-cards{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .main{max-width:960px;margin:0 auto}
  .timer-section{max-width:960px;margin:0 auto}
}
.hidden{display:none!important}
.flex{display:flex;align-items:center;gap:0.5rem}
.mt-1{margin-top:0.5rem}

/* ── BORD (muurscherm) ── */
body.bord-fullscreen{background:#1C1A16}
body.bord-fullscreen header,
body.bord-fullscreen .tabs-wrap,
body.bord-fullscreen .running-bar,
body.bord-fullscreen .desc-bar{display:none!important}
body.bord-fullscreen #tab-bord{background:#1C1A16;color:#F7F5F0;min-height:100vh}
.bord-wrap{padding:1.5rem 2rem}
body.bord-fullscreen .bord-wrap{padding:2rem 2.5rem}
.bord-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem}
.bord-datum{font-family:var(--serif);font-size:28px;font-weight:300;color:var(--text)}
body.bord-fullscreen .bord-datum{color:#F7F5F0;font-size:36px}
.bord-klok{font-family:var(--mono);font-size:22px;color:var(--text-faint)}
body.bord-fullscreen .bord-klok{color:rgba(255,255,255,0.5);font-size:28px}
.bord-controls{display:flex;gap:0.75rem;align-items:center}
.bord-fs-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:13px;font-family:var(--sans);cursor:pointer;color:var(--text-dim);transition:all 0.15s}
.bord-fs-btn:hover{border-color:var(--green-mid);color:var(--green)}
body.bord-fullscreen .bord-fs-btn{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.7)}
body.bord-fullscreen .bord-fs-btn:hover{background:rgba(255,255,255,0.2)}

.bord-sectie-label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-faint);margin-bottom:1rem}
body.bord-fullscreen .bord-sectie-label{color:rgba(255,255,255,0.35);font-size:13px}

/* Lopende timers */
.bord-actief-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:2.5rem}
body.bord-fullscreen .bord-actief-grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem}
.bord-actief-kaart{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:1.25rem 1.5rem;position:relative;overflow:hidden;box-shadow:var(--shadow)}
body.bord-fullscreen .bord-actief-kaart{background:#2a2720;border-color:rgba(255,255,255,0.12);border-radius:18px;padding:1.75rem 2rem}
.bord-actief-kaart.loopt{border-color:var(--green-mid)}
body.bord-fullscreen .bord-actief-kaart.loopt{border-color:#4A7A5C}
.bord-kaart-glow{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),var(--gold));opacity:0}
.bord-actief-kaart.loopt .bord-kaart-glow{opacity:1}
.bord-kaart-persoon{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.6rem}
.bord-kaart-persoon-dot{width:10px;height:10px;border-radius:50%}
.bord-kaart-persoon-naam{font-size:13px;font-family:var(--mono);color:var(--text-faint)}
body.bord-fullscreen .bord-kaart-persoon-naam{color:rgba(255,255,255,0.5);font-size:15px}
.bord-kaart-project{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--gold);margin-bottom:3px}
body.bord-fullscreen .bord-kaart-project{font-size:20px}
.bord-kaart-naam{font-size:14px;color:var(--text-dim);margin-bottom:0.75rem;line-height:1.3}
body.bord-fullscreen .bord-kaart-naam{font-size:17px;color:rgba(255,255,255,0.6)}
.bord-kaart-bottom{display:flex;align-items:center;justify-content:space-between}
.bord-kaart-timer{font-family:var(--mono);font-size:24px;font-weight:500;color:var(--text)}
body.bord-fullscreen .bord-kaart-timer{font-size:32px;color:#F7F5F0}
.bord-kaart-vandaag{font-family:var(--mono);font-size:12px;color:var(--text-faint)}
body.bord-fullscreen .bord-kaart-vandaag{color:rgba(255,255,255,0.35);font-size:14px}
.bord-pulse{width:8px;height:8px;border-radius:50%;background:#4caf50;animation:pulse 1.5s infinite;flex-shrink:0}

/* Weekplanning bord */
.bord-week-grid{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
body.bord-fullscreen .bord-week-grid{border-color:rgba(255,255,255,0.1);background:#242220;border-radius:16px}
.bord-week-header{display:grid;background:var(--surface2);border-bottom:1px solid var(--border)}
body.bord-fullscreen .bord-week-header{background:#1e1c1a;border-color:rgba(255,255,255,0.08)}
.bord-wh-cel{padding:0.75rem 1rem;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);border-right:1px solid var(--border);text-align:center}
body.bord-fullscreen .bord-wh-cel{color:rgba(255,255,255,0.3);border-color:rgba(255,255,255,0.08);padding:1rem 1.25rem;font-size:13px}
.bord-wh-cel:last-child{border-right:none}
.bord-wh-cel.vandaag{color:var(--green);font-weight:600}
body.bord-fullscreen .bord-wh-cel.vandaag{color:var(--gold)}
.bord-week-rij{display:grid;border-bottom:1px solid var(--border)}
body.bord-fullscreen .bord-week-rij{border-color:rgba(255,255,255,0.06)}
.bord-week-rij:last-child{border-bottom:none}
.bord-project-label{padding:0.75rem 1rem;background:var(--surface2);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:2px;min-width:0}
body.bord-fullscreen .bord-project-label{background:#1e1c1a;border-color:rgba(255,255,255,0.08);padding:1rem 1.25rem}
.bord-pl-code{font-family:var(--mono);font-size:11px;color:var(--gold);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.bord-fullscreen .bord-pl-code{font-size:14px}
.bord-pl-naam{font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.bord-fullscreen .bord-pl-naam{font-size:13px;color:rgba(255,255,255,0.35)}
.bord-dag-cel{padding:0.4rem;border-right:1px solid var(--border);min-height:52px;position:relative;vertical-align:top}
body.bord-fullscreen .bord-dag-cel{border-color:rgba(255,255,255,0.06);min-height:70px;padding:0.5rem}
.bord-dag-cel:last-child{border-right:none}
.bord-dag-cel.vandaag{background:rgba(42,74,56,0.08)}
body.bord-fullscreen .bord-dag-cel.vandaag{background:rgba(42,74,56,0.25)}
.bord-blok{border-radius:6px;padding:3px 8px;margin-bottom:3px;font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:4px}
body.bord-fullscreen .bord-blok{border-radius:8px;padding:5px 10px;margin-bottom:4px;font-size:13px}
.bord-blok-plan{background:var(--surface2);border:1px dashed var(--border-strong)}
body.bord-fullscreen .bord-blok-plan{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.15)}
.bord-blok-plan-label{font-family:var(--mono);color:var(--text-faint)}
body.bord-fullscreen .bord-blok-plan-label{color:rgba(255,255,255,0.4)}
.bord-blok-act{border:none}
.bord-blok-act-label{font-family:var(--mono);color:#fff;font-weight:500;font-size:10px}
body.bord-fullscreen .bord-blok-act-label{font-size:12px}
.bord-blok-act-uren{font-family:var(--mono);color:rgba(255,255,255,0.7);font-size:10px}
body.bord-fullscreen .bord-blok-act-uren{font-size:12px}
.bord-leeg{padding:2rem;text-align:center;color:var(--text-faint);font-size:13px}
body.bord-fullscreen .bord-leeg{color:rgba(255,255,255,0.3)}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Mortise <span>&</span> Tenon</h1>
    <span class="header-version">uren</span>
  </div>
  <div class="header-right">
    <button class="user-chip" id="user-chip" onclick="toggleGebruiker()">— kies jezelf —</button>
    <button class="icon-btn" onclick="openInstellingen()" title="Instellingen">⚙</button>
  </div>
</header>

<!-- Welkom / gebruiker kiezen -->
<div id="welkom-scherm" class="welkom hidden">
  <div class="welkom-title">Wie ben <span>jij</span>?</div>
  <div class="welkom-sub">Kies je naam. Je kunt dit altijd aanpassen via ⚙ instellingen.</div>
  <div class="naam-knoppen" id="naam-knoppen"></div>
</div>

<!-- Hoofdapp -->
<div id="app" class="hidden">
  <!-- Lopende timer banner -->
  <div class="running-bar hidden" id="running-bar">
    <div class="running-info">
      <div class="running-project" id="running-project">—</div>
      <div class="running-desc" id="running-desc"></div>
    </div>
    <div class="running-right">
      <div class="pulse"></div>
      <div class="running-clock" id="running-clock">00:00:00</div>
      <button class="stop-btn" onclick="stopTimer()">■ Stop</button>
    </div>
  </div>

  <!-- Beschrijving toevoegen aan lopende timer -->
  <div class="desc-bar hidden" id="desc-bar">
    <input class="desc-input" id="desc-input" placeholder="Omschrijving toevoegen (optioneel)…" onkeydown="if(event.key==='Enter')slaDescOp()">
    <button class="desc-save" onclick="slaDescOp()">Opslaan</button>
  </div>

  <div class="tabs-wrap">
    <button class="tab-btn active" onclick="showTab('timer',this)">⏱ Timer</button>
    <button class="tab-btn" onclick="showTab('dag',this)">📋 Dag</button>
    <button class="tab-btn" onclick="showTab('planning',this)">📅 Planning</button>
    <button class="tab-btn" onclick="showTab('projecten',this)">📊 Projecten</button>
    <button class="tab-btn" onclick="showTab('bord',this)">🖥 Bord</button>
  </div>

  <!-- Tab: Timer -->
  <div id="tab-timer" class="tab-content active">
    <div class="timer-section">
      <div class="section-label" id="timer-label">Kies een project om te starten</div>
      <div class="project-cards" id="project-cards"></div>
    </div>
  </div>

  <!-- Tab: Dag overzicht -->
  <div id="tab-dag" class="tab-content">
    <div class="main">
      <div class="dag-header">
        <div class="dag-nav">
          <button onclick="dagNavigeer(-1)">←</button>
          <button onclick="dagNavigeer(0)">Vandaag</button>
          <button onclick="dagNavigeer(1)">→</button>
        </div>
        <div class="dag-datum" id="dag-datum-label">—</div>
        <input type="date" class="dag-input" id="dag-datum-input" onchange="dagSetDatum(this.value)">
      </div>
      <div id="dag-inhoud"></div>
    </div>
  </div>

  <!-- Tab: Planning -->
  <div id="tab-planning" class="tab-content">
    <div class="main">
      <div class="planning-header">
        <div class="week-label" id="week-label">—</div>
        <div class="week-nav">
          <button onclick="weekNavigeer(-1)">← Vorige week</button>
          <button onclick="weekNavigeer(0)">Deze week</button>
          <button onclick="weekNavigeer(1)">Volgende week →</button>
        </div>
      </div>
      <div id="week-grid-wrap"></div>
    </div>
  </div>

  <!-- Tab: Projecten rapport -->
  <div id="tab-projecten" class="tab-content">
    <div class="main">
      <div class="filter-row" id="periode-filter">
        <button class="periode-btn active" data-periode="week" onclick="setPeriode('week',this)">Deze week</button>
        <button class="periode-btn" data-periode="maand" onclick="setPeriode('maand',this)">Deze maand</button>
        <button class="periode-btn" data-periode="alles" onclick="setPeriode('alles',this)">Alles</button>
        <button class="periode-btn" data-periode="custom" onclick="setPeriode('custom',this)">Eigen periode</button>
        <span id="custom-periode-inputs" class="hidden flex" style="gap:0.4rem;align-items:center">
          <input type="date" class="dag-input" id="custom-van" onchange="renderProjectRapport()">
          <span style="color:var(--text-faint)">t/m</span>
          <input type="date" class="dag-input" id="custom-tm" onchange="renderProjectRapport()">
        </span>
      </div>
      <div id="project-rapport"></div>
    </div>
  </div>

  <!-- Tab: Bord (muurscherm) -->
  <div id="tab-bord" class="tab-content">
    <div class="bord-wrap">
      <div class="bord-topbar">
        <div>
          <div class="bord-datum" id="bord-datum"></div>
          <div class="bord-klok" id="bord-klok"></div>
        </div>
        <div class="bord-controls">
          <button class="bord-fs-btn" onclick="toggleFullscreen()">⛶ Volledig scherm</button>
        </div>
      </div>
      <div class="bord-sectie-label">Nu bezig</div>
      <div class="bord-actief-grid" id="bord-actief"></div>
      <div class="bord-sectie-label">Deze week</div>
      <div id="bord-week"></div>
    </div>
  </div>
</div>

<!-- Modal: Instellingen -->
<div class="modal-overlay" id="modal-instellingen-overlay" onclick="if(event.target===this)sluitModal('instellingen')">
  <div class="modal">
    <div class="modal-title">
      Instellingen
      <button class="modal-close" onclick="sluitModal('instellingen')">✕</button>
    </div>
    <div class="inst-sectie">
      <div class="inst-sectie-title">Team</div>
      <div id="teamleden-lijst"></div>
      <div style="margin-top:0.75rem">
        <button class="btn btn-secondary btn-sm" onclick="voegTeamlidToe()">+ Teamlid toevoegen</button>
      </div>
    </div>
    <div class="inst-sectie">
      <div class="inst-sectie-title">Data</div>
      <button class="btn btn-secondary btn-sm" onclick="exportData()">Exporteer uren (CSV)</button>
      <button class="btn btn-danger btn-sm" style="margin-left:0.5rem" onclick="wisAllesBevestig()">⚠ Alles wissen</button>
    </div>
  </div>
</div>

<!-- Modal: Entry bewerken -->
<div class="modal-overlay" id="modal-entry-overlay" onclick="if(event.target===this)sluitModal('entry')">
  <div class="modal">
    <div class="modal-title">Entry aanpassen <button class="modal-close" onclick="sluitModal('entry')">✕</button></div>
    <div class="form-row">
      <label class="form-label">Project</label>
      <select class="form-select" id="edit-project"></select>
    </div>
    <div class="form-row">
      <label class="form-label">Omschrijving</label>
      <input class="form-input" id="edit-desc" placeholder="Omschrijving…">
    </div>
    <div class="form-row flex" style="gap:1rem">
      <div style="flex:1">
        <label class="form-label">Start</label>
        <input class="form-input" type="time" id="edit-start">
      </div>
      <div style="flex:1">
        <label class="form-label">Stop</label>
        <input class="form-input" type="time" id="edit-stop">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="sluitModal('entry')">Annuleer</button>
      <button class="btn btn-primary" onclick="slaEntryOp()">Opslaan</button>
    </div>
  </div>
</div>

<!-- Modal: Planblok aanmaken -->
<div class="modal-overlay" id="modal-plan-overlay" onclick="if(event.target===this)sluitModal('plan')">
  <div class="modal">
    <div class="modal-title">Plan aanmaken <button class="modal-close" onclick="sluitModal('plan')">✕</button></div>
    <div class="form-row">
      <label class="form-label">Project</label>
      <select class="form-select" id="plan-project"></select>
    </div>
    <div class="form-row">
      <label class="form-label">Uren gepland</label>
      <input class="form-input" type="number" id="plan-uren" min="0.5" max="24" step="0.5" value="4">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="sluitModal('plan')">Annuleer</button>
      <button class="btn btn-primary" onclick="slaPlanblocOp()">Opslaan</button>
    </div>
  </div>
</div>

<!-- Modal: Entry handmatig toevoegen -->
<div class="modal-overlay" id="modal-nieuw-overlay" onclick="if(event.target===this)sluitModal('nieuw')">
  <div class="modal">
    <div class="modal-title">Entry toevoegen <button class="modal-close" onclick="sluitModal('nieuw')">✕</button></div>
    <div class="form-row">
      <label class="form-label">Teamlid</label>
      <select class="form-select" id="nieuw-teamlid"></select>
    </div>
    <div class="form-row">
      <label class="form-label">Project</label>
      <select class="form-select" id="nieuw-project"></select>
    </div>
    <div class="form-row">
      <label class="form-label">Omschrijving</label>
      <input class="form-input" id="nieuw-desc" placeholder="Omschrijving…">
    </div>
    <div class="form-row flex" style="gap:1rem">
      <div style="flex:1">
        <label class="form-label">Start</label>
        <input class="form-input" type="time" id="nieuw-start" value="08:00">
      </div>
      <div style="flex:1">
        <label class="form-label">Stop</label>
        <input class="form-input" type="time" id="nieuw-stop" value="12:00">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="sluitModal('nieuw')">Annuleer</button>
      <button class="btn btn-primary" onclick="slaHandmatigOp()">Toevoegen</button>
    </div>
  </div>
</div>

<script>
// ── STANDAARD TEAMLEDEN ──
const STANDAARD_TEAMLEDEN = [
  {naam:'bart',    label:'Bart',    kleur:'#2A4A38', rol:'admin'},
  {naam:'mathijs', label:'Mathijs', kleur:'#B8962E', rol:'admin'},
  {naam:'arjan',   label:'Arjan',   kleur:'#5a3a8b', rol:'medewerker'},
  {naam:'maarten', label:'Maarten', kleur:'#1a3a8b', rol:'medewerker'},
];

// ── STATE ──
let IK = null; // ingelogde gebruiker (naam string)
let actieveTab = 'timer';
let timerInterval = null;
let dagDatum = vandaagStr();
let weekOffset = 0;
let activePeriode = 'week';
let editEntryId = null;
let planContext = null; // {datum, teamlid} voor modal
let huidigProject = null; // project waarop timer gestart gaat worden

// ── HELPERS ──
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function vandaagStr(){return new Date().toISOString().slice(0,10)}
function datumStr(d){return d.toISOString().slice(0,10)}
function fmtTijd(iso){if(!iso)return'—';const d=new Date(iso);return d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}
function fmtDuur(sec){if(!sec&&sec!==0)return'—';const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function fmtUren(sec){const h=(sec/3600).toFixed(1);return h+'u'}
function fmtDatumNL(str){return new Date(str+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'})}
function weekdagKort(str){return new Date(str+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'short'})}

// ── LOCALSTORAGE ──
function getEntries(){return JSON.parse(localStorage.getItem('mt_uren_entries')||'[]')}
function setEntries(e){localStorage.setItem('mt_uren_entries',JSON.stringify(e))}
function getPlanning(){return JSON.parse(localStorage.getItem('mt_uren_planning')||'[]')}
function setPlanning(p){localStorage.setItem('mt_uren_planning',JSON.stringify(p))}
function getTeamleden(){return JSON.parse(localStorage.getItem('mt_uren_teamleden')||'null')||STANDAARD_TEAMLEDEN}
function setTeamleden(t){localStorage.setItem('mt_uren_teamleden',JSON.stringify(t))}
function getProjecten(){
  // Gebruik mt_projecten van de v4-tool (zelfde localStorage origin)
  const raw = JSON.parse(localStorage.getItem('mt_projecten')||'null');
  if(raw&&raw.length) return raw;
  // Fallback eigen lijst
  return JSON.parse(localStorage.getItem('mt_uren_projecten_eigen')||'[]');
}
function getLopende(){return JSON.parse(localStorage.getItem('mt_uren_lopend')||'null')}
function setLopende(e){if(e)localStorage.setItem('mt_uren_lopend',JSON.stringify(e));else localStorage.removeItem('mt_uren_lopend')}

// ── OPSTARTEN ──
function init(){
  IK = localStorage.getItem('mt_uren_ik');
  if(!IK){
    toonWelkom();
  } else {
    toonApp();
  }
}

function toonWelkom(){
  document.getElementById('welkom-scherm').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  const tl = getTeamleden();
  const wrap = document.getElementById('naam-knoppen');
  wrap.innerHTML = tl.map(t=>`
    <button class="naam-knop" onclick="kiesGebruiker('${t.naam}')">
      <span class="naam-knop-dot" style="background:${t.kleur}"></span>
      ${t.label}
    </button>
  `).join('');
}

function kiesGebruiker(naam){
  localStorage.setItem('mt_uren_ik',naam);
  IK = naam;
  document.getElementById('welkom-scherm').classList.add('hidden');
  toonApp();
}

function toggleGebruiker(){
  const tl = getTeamleden();
  const idx = tl.findIndex(t=>t.naam===IK);
  const volgende = tl[(idx+1)%tl.length];
  kiesGebruiker(volgende.naam);
}

function toonApp(){
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('welkom-scherm').classList.add('hidden');
  updateUserChip();
  herstelLopende();
  renderTimer();
  renderDag();
  renderProjectRapport();
}

function updateUserChip(){
  const tl = getTeamleden();
  const t = tl.find(x=>x.naam===IK)||{label:'?',kleur:'#999'};
  const chip = document.getElementById('user-chip');
  chip.textContent = t.label;
  chip.style.borderColor = t.kleur+'66';
}

// ── TIMER ──
function renderTimer(){
  const projecten = getProjecten();
  const lopend = getLopende();
  const label = document.getElementById('timer-label');
  const cards = document.getElementById('project-cards');

  if(lopend){
    label.textContent = 'Timer loopt — klik op een ander project om te wisselen';
  } else {
    label.textContent = 'Kies een project om te starten';
  }

  if(!projecten.length){
    cards.innerHTML = `<div class="no-projects">Geen projecten gevonden. Maak projecten aan in de <a href="index-v4.html" style="color:var(--green)">M&T Bedrijfstool</a>.</div>`;
    return;
  }

  // Bereken uren vandaag per project
  const entries = getEntries();
  const vandaag = vandaagStr();
  const urenVandaag = {};
  entries.filter(e=>e.teamlid===IK&&e.datum===vandaag&&e.duur).forEach(e=>{
    urenVandaag[e.project_code] = (urenVandaag[e.project_code]||0) + e.duur;
  });

  cards.innerHTML = projecten.map(p=>{
    const actief = lopend && lopend.project_code === p.code;
    const uren = urenVandaag[p.code];
    const urenTekst = uren ? fmtUren(uren)+' vandaag' : '';
    return `<div class="project-card${actief?' actief':''}" onclick="startTimer('${p.code}')">
      <div class="project-card-code">${p.code}</div>
      <div class="project-card-naam">${p.naam||p.code}</div>
      ${urenTekst?`<div class="project-card-uren">${urenTekst}</div>`:''}
    </div>`;
  }).join('');
}

function startTimer(projectCode){
  const lopend = getLopende();

  // Als al iets loopt, stop dat eerst
  if(lopend){
    stopTimerIntern(lopend);
  }

  const entry = {
    id: uid(),
    teamlid: IK,
    project_code: projectCode,
    omschrijving: '',
    start: new Date().toISOString(),
    stop: null,
    duur: null,
    datum: vandaagStr()
  };

  setLopende(entry);
  toonRunningBar(entry);
  startKlok();
  renderTimer();

  // Toon beschrijving-balk
  document.getElementById('desc-bar').classList.remove('hidden');
  document.getElementById('desc-input').value = '';
  document.getElementById('desc-input').focus();
}

function stopTimer(){
  const lopend = getLopende();
  if(!lopend) return;
  stopTimerIntern(lopend);
  setLopende(null);
  stopKlok();
  document.getElementById('running-bar').classList.add('hidden');
  document.getElementById('desc-bar').classList.add('hidden');
  renderTimer();
  if(actieveTab==='dag') renderDag();
  if(actieveTab==='projecten') renderProjectRapport();
}

function stopTimerIntern(lopend){
  const nu = new Date().toISOString();
  const duur = Math.round((new Date(nu)-new Date(lopend.start))/1000);
  const entry = {...lopend, stop: nu, duur};
  const entries = getEntries();
  entries.push(entry);
  setEntries(entries);
}

function slaDescOp(){
  const lopend = getLopende();
  if(!lopend) return;
  lopend.omschrijving = document.getElementById('desc-input').value.trim();
  setLopende(lopend);
  document.getElementById('running-desc').textContent = lopend.omschrijving||'';
  document.getElementById('desc-bar').classList.add('hidden');
}

function herstelLopende(){
  const lopend = getLopende();
  if(!lopend) return;
  toonRunningBar(lopend);
  startKlok();
  document.getElementById('desc-bar').classList.remove('hidden');

function toonRunningBar(entry){
  const projecten = getProjecten();
  const p = projecten.find(x=>x.code===entry.project_code);
  document.getElementById('running-project').textContent = entry.project_code + (p&&p.naam?' — '+p.naam:'');
  document.getElementById('running-desc').textContent = entry.omschrijving||'';
  document.getElementById('running-bar').classList.remove('hidden');
  updateKlok(entry.start);

function startKlok(){
  stopKlok();
  timerInterval = setInterval(()=>{
    const lopend = getLopende();
    if(lopend) updateKlok(lopend.start);
  },1000);
}

function stopKlok(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
}

function updateKlok(startIso){
  const sec = Math.round((Date.now()-new Date(startIso))/1000);
  document.getElementById('running-clock').textContent = fmtDuur(sec);
}

function dagNavigeer(richting){
  if(richting===0){dagDatum=vandaagStr();}
  else{
    const d=new Date(dagDatum+'T12:00:00');
    d.setDate(d.getDate()+richting);

function dagSetDatum(val){dagDatum=val;renderDag();}

// ── PLANNING ──
function renderPlanning(){
  const ma = maandagVanWeek(weekOffset);
  const dagen = [];
  for(let i=0;i<7;i++){const d=new Date(ma);d.setDate(d.getDate()+i);dagen.push(datumStr(d));}

  const van = dagen[0], tm = dagen[6];
  document.getElementById('week-label').textContent =
    `Week ${weekNummer(new Date(ma+'T12:00:00'))} — ${new Date(van+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short'})} t/m ${new Date(tm+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'})}`;

  const tl = getTeamleden();
  const planning = getPlanning();
  const entries = getEntries();
  const projecten = getProjecten();

  // Bouw grid
  const colCount = tl.length + 1; // +1 voor dag-label kolom
  const colTemplate = `80px repeat(${tl.length},1fr)`;

  let html = `<div class="week-grid">
    <div class="week-col-headers" style="grid-template-columns:${colTemplate}">
      <div class="week-col-header"></div>
      ${tl.map(t=>`<div class="week-col-header" style="color:${t.kleur}">${t.label}</div>`).join('')}
    </div>`;

  dagen.forEach((datum,di)=>{
    const isWeekend = di>=5;
    html += `<div class="week-row" style="grid-template-columns:${colTemplate}">
      <div class="week-dag-label${isWeekend?' weekend':''}">
        <span class="week-dag-dag">${weekdagKort(datum)}</span>
        <span class="week-dag-datum">${new Date(datum+'T12:00:00').getDate()} ${new Date(datum+'T12:00:00').toLocaleDateString('nl-NL',{month:'short'})}</span>
      </div>`;

    tl.forEach(t=>{
      const planBlokken = planning.filter(p=>p.datum===datum&&p.teamlid===t.naam);
      const dagEntries = entries.filter(e=>e.datum===datum&&e.teamlid===t.naam);
      const gerealiseerd = dagEntries.reduce((s,e)=>s+(e.duur||0),0);

      html += `<div class="week-cel${isWeekend?' weekend':''}" onclick="openPlanModal('${datum}','${t.naam}')">
        ${planBlokken.map(pb=>{
          const p = projecten.find(x=>x.code===pb.project_code);
          return `<div class="plan-blok" onclick="event.stopPropagation()">
            <div class="plan-blok-code">${pb.project_code}</div>
            <div class="plan-blok-uren">${pb.uren_gepland}u gepland</div>
            <button class="plan-blok-del" onclick="event.stopPropagation();verwijderPlan('${pb.id}')">✕</button>
          </div>`;
        }).join('')}
        ${gerealiseerd>0?`<div class="plan-realisatie">✓ ${fmtUren(gerealiseerd)}</div>`:''}
      </div>`;
    });

    html += `</div>`;
  });

  html += `</div>`;
  document.getElementById('week-grid-wrap').innerHTML = html;
}

function weekNavigeer(richting){
  if(richting===0)weekOffset=0;else weekOffset+=richting;
  renderPlanning();
}

function maandagVanWeek(offset=0){
  const nu=new Date();
  const dag=nu.getDay();
  const diff=dag===0?-6:1-dag;
  nu.setDate(nu.getDate()+diff+offset*7);
  return datumStr(nu);
}

function weekNummer(d){
  const start=new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-start)/86400000+start.getDay()+1)/7);
}

// ── PROJECT RAPPORT ──
function renderProjectRapport(){
  const [van, tm] = getPeriodeDatums();
  const entries = getEntries().filter(e=>e.duur&&e.datum>=van&&e.datum<=tm);
  const tl = getTeamleden();
  const projecten = getProjecten();

  // Groepeer per project
  const perProject = {};
  entries.forEach(e=>{
    if(!perProject[e.project_code]) perProject[e.project_code]={code:e.project_code,totaal:0,per_persoon:{}};
    perProject[e.project_code].totaal += e.duur;
    perProject[e.project_code].per_persoon[e.teamlid] = (perProject[e.project_code].per_persoon[e.teamlid]||0)+e.duur;
  });

  const gesorteerd = Object.values(perProject).sort((a,b)=>b.totaal-a.totaal);
  const max = gesorteerd[0]?.totaal||1;

  const wrap = document.getElementById('project-rapport');
  if(!gesorteerd.length){
    wrap.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--text-faint);font-size:13px">Geen uren in deze periode</div>';
    return;
  }

  wrap.innerHTML = gesorteerd.map(pr=>{
    const p = projecten.find(x=>x.code===pr.code);
    const breakdown = tl.filter(t=>pr.per_persoon[t.naam]).map(t=>`
      <span class="pr-persoon">
        <span class="pr-persoon-dot" style="background:${t.kleur}"></span>
        ${t.label} ${fmtUren(pr.per_persoon[t.naam])}
      </span>`).join('');
    return `<div class="project-rapport-item">
      <div class="pr-header">
        <div>
          <div class="pr-code">${pr.code}</div>
          <div class="pr-naam">${p?.naam||''}</div>
        </div>
        <div class="pr-totaal">${fmtUren(pr.totaal)}</div>
      </div>
      <div class="pr-bar-wrap"><div class="pr-bar" style="width:${Math.round(pr.totaal/max*100)}%"></div></div>
      <div class="pr-breakdown">${breakdown}</div>
    </div>`;
  }).join('');
}

function getPeriodeDatums(){
  const nu = new Date();
  if(activePeriode==='week'){
    const ma = maandagVanWeek(0);
    const zo = datumStr(new Date(new Date(ma+'T12:00:00').setDate(new Date(ma+'T12:00:00').getDate()+6)));
    return [ma, zo];
  }
  if(activePeriode==='maand'){
    const van = `${nu.getFullYear()}-${String(nu.getMonth()+1).padStart(2,'0')}-01`;
    const tm = datumStr(new Date(nu.getFullYear(),nu.getMonth()+1,0));
    return [van, tm];
  }
  if(activePeriode==='custom'){
    const van = document.getElementById('custom-van')?.value||'2000-01-01';
    const tm = document.getElementById('custom-tm')?.value||vandaagStr();
    return [van, tm];
  }
  return ['2000-01-01', '2099-12-31'];
}

function setPeriode(periode, btn){
  activePeriode = periode;
  document.querySelectorAll('.periode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const cust = document.getElementById('custom-periode-inputs');
  if(periode==='custom') cust.classList.remove('hidden'); else cust.classList.add('hidden');
  renderProjectRapport();
}

function openEditEntry(id){
  editEntryId = id;
  const e = getEntries().find(x=>x.id===id);
  if(!e) return;
  const startTime = e.start ? new Date(e.start).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',hour12:false}) : '';
  const stopTime = e.stop ? new Date(e.stop).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',hour12:false}) : '';
  document.getElementById('edit-desc').value = e.omschrijving||'';
  document.getElementById('edit-start').value = startTime;
  document.getElementById('edit-stop').value = stopTime;
  vulProjectSelect('edit-project', e.project_code);
  openModal('entry');
}

function slaEntryOp(){
  if(!editEntryId) return;
  const entries = getEntries();
  const idx = entries.findIndex(x=>x.id===editEntryId);
  if(idx<0) return;
  const e = entries[idx];
  const startStr = document.getElementById('edit-start').value;
  const stopStr = document.getElementById('edit-stop').value;
  const datum = e.datum;
  const startIso = startStr ? new Date(`${datum}T${startStr}:00`).toISOString() : e.start;
  const stopIso = stopStr ? new Date(`${datum}T${stopStr}:00`).toISOString() : e.stop;
  const duur = startIso&&stopIso ? Math.round((new Date(stopIso)-new Date(startIso))/1000) : e.duur;
  entries[idx] = {...e, project_code: document.getElementById('edit-project').value, omschrijving: document.getElementById('edit-desc').value.trim(), start: startIso, stop: stopIso, duur};
  setEntries(entries);
  sluitModal('entry');
  renderDag();
  if(actieveTab==='projecten') renderProjectRapport();
}

function verwijderEntry(id){
  if(!confirm('Entry verwijderen?')) return;
  setEntries(getEntries().filter(e=>e.id!==id));
  renderDag();
  if(actieveTab==='projecten') renderProjectRapport();
  renderTimer();
}

function slaHandmatigOp(){

  const omschrijving = document.getElementById('nieuw-desc').value.trim();

// ── BORD ──
let bordInterval = null;
let bordKlokInterval = null;
let bordTikerInterval = null;

function renderBord(){
  renderBordActief();
  renderBordWeek();
}

function renderBordActief(){
  const tl = getTeamleden();
  const projecten = getProjecten();
  const lopend = getLopende();
  const entries = getEntries();
  const vandaag = vandaagStr();
  const wrap = document.getElementById('bord-actief');
  if(!wrap) return;

  // Bouw kaarten: één per teamlid (ook als ze niets doen = grijze kaart)
  const kaarten = tl.map(t=>{
    const isIk = lopend && lopend.teamlid === t.naam;
    const dagEntries = entries.filter(e=>e.teamlid===t.naam&&e.datum===vandaag&&e.duur);
    const vandaagTotaal = dagEntries.reduce((s,e)=>s+(e.duur||0),0);
    const lopendEntry = isIk ? lopend : null;
    const huidigProject = lopendEntry ? projecten.find(p=>p.code===lopendEntry.project_code) : null;
    const timerSec = lopendEntry ? Math.round((Date.now()-new Date(lopendEntry.start))/1000) : 0;

    return {t, lopendEntry, huidigProject, vandaagTotaal, timerSec};
  });

  wrap.innerHTML = kaarten.map(({t, lopendEntry, huidigProject, vandaagTotaal, timerSec})=>`
    <div class="bord-actief-kaart${lopendEntry?' loopt':''}">
      <div class="bord-kaart-glow"></div>
      <div class="bord-kaart-persoon">
        <span class="bord-kaart-persoon-dot" style="background:${t.kleur}"></span>
        <span class="bord-kaart-persoon-naam">${t.label}</span>
        ${lopendEntry?'<span class="bord-pulse" style="margin-left:auto"></span>':''}
      </div>
      ${lopendEntry
        ? `<div class="bord-kaart-project">${lopendEntry.project_code}</div>
           <div class="bord-kaart-naam">${huidigProject?.naam||''}</div>
           <div class="bord-kaart-bottom">
             <div class="bord-kaart-timer" data-start="${lopendEntry.start}" data-id="bord-timer-${t.naam}">${fmtDuur(timerSec)}</div>
             <div class="bord-kaart-vandaag">Vandaag ${fmtUren(vandaagTotaal)}</div>
           </div>`
        : `<div class="bord-kaart-naam" style="font-style:italic;margin-top:0.25rem">${vandaagTotaal?'Gestopt':'Geen timer actief'}</div>
           <div class="bord-kaart-bottom">
             <div class="bord-kaart-timer" style="opacity:0.3">—</div>
             <div class="bord-kaart-vandaag">${vandaagTotaal?'Vandaag '+fmtUren(vandaagTotaal):''}</div>
           </div>`
      }
    </div>`).join('');
}

function tickBordTimers(){
  // Update alle lopende timer-displays op het bord zonder de DOM opnieuw op te bouwen
  document.querySelectorAll('[data-start][data-id]').forEach(el=>{
    const sec = Math.round((Date.now()-new Date(el.dataset.start))/1000);
    el.textContent = fmtDuur(sec);
  });
  // Update klok
  const klok = document.getElementById('bord-klok');
  if(klok) klok.textContent = new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function renderBordWeek(){
  const wrap = document.getElementById('bord-week');
  if(!wrap) return;
  const ma = maandagVanWeek(0);
  const dagen = [];
  for(let i=0;i<5;i++){const d=new Date(ma+'T12:00:00');d.setDate(d.getDate()+i);dagen.push(datumStr(d));}
  const vandaag = vandaagStr();
  const tl = getTeamleden();
  const projecten = getProjecten();
  const planning = getPlanning();
  const entries = getEntries();

  // Bepaal welke projecten relevant zijn deze week
  const relevante = new Set();
  planning.filter(p=>dagen.includes(p.datum)).forEach(p=>relevante.add(p.project_code));
  entries.filter(e=>dagen.includes(e.datum)&&e.duur).forEach(e=>relevante.add(e.project_code));

  if(!relevante.size){
    wrap.innerHTML = `<div class="bord-leeg">Geen projecten ingepland of geregistreerd deze week</div>`;
    return;
  }

  const labelBreedte = 140;
  const colTemplate = `${labelBreedte}px repeat(5,1fr)`;

  let html = `<div class="bord-week-grid">
    <div class="bord-week-header" style="grid-template-columns:${colTemplate}">
      <div class="bord-wh-cel"></div>
      ${dagen.map(d=>{
        const dObj = new Date(d+'T12:00:00');
        const dag = dObj.toLocaleDateString('nl-NL',{weekday:'short'});
        const datum = dObj.toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
        return `<div class="bord-wh-cel${d===vandaag?' vandaag':''}">${dag}<br><span style="font-size:10px;opacity:0.7">${datum}</span></div>`;
      }).join('')}
    </div>`;

  [...relevante].sort().forEach(code=>{
    const p = projecten.find(x=>x.code===code);
    html += `<div class="bord-week-rij" style="grid-template-columns:${colTemplate}">
      <div class="bord-project-label">
        <div class="bord-pl-code">${code}</div>
        <div class="bord-pl-naam">${p?.naam||''}</div>
      </div>`;

    dagen.forEach(dag=>{
      html += `<div class="bord-dag-cel${dag===vandaag?' vandaag':''}">`;

      // Planblokken (gestippeld)
      planning.filter(pb=>pb.datum===dag&&pb.project_code===code).forEach(pb=>{
        const tlid = tl.find(t=>t.naam===pb.teamlid);
        html += `<div class="bord-blok bord-blok-plan" style="border-color:${tlid?.kleur||'#999'}44">
          <span class="bord-blok-plan-label">${tlid?.label||pb.teamlid} ${pb.uren_gepland}u plan</span>
        </div>`;
      });

      // Gerealiseerde uren per persoon (kleur-blok)
      tl.forEach(t=>{
        const som = entries.filter(e=>e.datum===dag&&e.project_code===code&&e.teamlid===t.naam&&e.duur)
                          .reduce((s,e)=>s+(e.duur||0),0);
        if(som>0){
          html += `<div class="bord-blok bord-blok-act" style="background:${t.kleur}">
            <span class="bord-blok-act-label">${t.label}</span>
            <span class="bord-blok-act-uren">${fmtUren(som)}</span>
          </div>`;
        }
      });

      html += `</div>`;
    });

    html += `</div>`;
  });

  html += `</div>`;
  wrap.innerHTML = html;
}

function startBord(){
  // Datum header
  const datum = document.getElementById('bord-datum');
  if(datum) datum.textContent = new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  renderBord();
  // Klok tikt elke seconde
  if(bordKlokInterval) clearInterval(bordKlokInterval);
  bordKlokInterval = setInterval(tickBordTimers, 1000);
  // Volledig bord herlaadt elke 30 seconden (nieuwe entries van anderen)
  if(bordInterval) clearInterval(bordInterval);
  bordInterval = setInterval(()=>{
    renderBordActief();
    renderBordWeek();
  }, 30000);
}

function stopBord(){
  if(bordKlokInterval){clearInterval(bordKlokInterval);bordKlokInterval=null;}
  if(bordInterval){clearInterval(bordInterval);bordInterval=null;}
}

function toggleFullscreen(){
  const fs = document.body.classList.toggle('bord-fullscreen');
  const btn = document.querySelector('.bord-fs-btn');
  if(btn) btn.textContent = fs ? '✕ Verlaat volledig scherm' : '⛶ Volledig scherm';
  if(fs){
    document.documentElement.requestFullscreen?.().catch(()=>{});
  } else {
    document.exitFullscreen?.().catch(()=>{});
  }
}

// ── TABS ──
function showTab(naam, btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+naam).classList.add('active');
  if(btn) btn.classList.add('active');
  actieveTab = naam;
  if(naam==='dag') renderDag();
  if(naam==='planning') renderPlanning();
  if(naam==='projecten') renderProjectRapport();
  if(naam==='timer') renderTimer();
  if(naam==='bord'){startBord();}else{stopBord();}
}

// ── START ──
init();
</script>
</body>
</html>
