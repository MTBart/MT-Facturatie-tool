<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Rondkijken opname</title>
<!-- Losse proefpagina (17-11-2026): een AR-opname van de AR-proef terugkijken. De wanden staan met de vastgelegde beelden erop;
     je loopt door de kamer of kijkt er als in een poppenhuis van boven in. Leest een bestand van de telefoon of de laatste opname
     op dit apparaat. Stuurt niets weg. -->
<style>
/* Indeling: het 3D-beeld vult het scherm; linksboven de plattegrond met de standpunten, onderin de bediening. */
:root{
  --bg:#eef1ed; --vlak:#ffffff; --inkt:#16211a; --zacht:#5d6b62; --rand:#cfd6d0;
  --primair:#17643f; --primair-zacht:#ddefe3; --op-primair:#ffffff; --oranje:#a86504; --kies:#1c5fc4;
  --letter:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111713; --vlak:#1a221d; --inkt:#e6ece7; --zacht:#9aa79e; --rand:#33403a; --primair:#5cc08b; --primair-zacht:#1d3a2a; --op-primair:#0c1a12; --oranje:#e3a23c; --kies:#78adff; color-scheme:dark; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--inkt);font:15px/1.4 var(--letter);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--kies);outline-offset:2px}
#beeld{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#2b302d}
.laden{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(16px, env(safe-area-inset-left, 0px))}
.laden .kaart{background:var(--vlak);border:1px solid var(--rand);border-radius:14px;padding:18px;max-width:480px;display:flex;flex-direction:column;gap:10px}
.laden h1{font-size:20px;margin:0}
.knop{border:1px solid var(--rand);background:var(--vlak);border-radius:12px;padding:11px 16px;min-height:46px}
.knop.hoofd{background:var(--primair);border-color:var(--primair);color:var(--op-primair);font-weight:650}
.knop input{position:absolute;width:1px;height:1px;opacity:0}
.melding{border-radius:10px;padding:10px 12px;background:#fbeed8;color:#7a4b06;font-weight:600}
#kaartje{position:fixed;left:max(10px, env(safe-area-inset-left, 0px));top:max(10px, env(safe-area-inset-top, 0px));width:min(42vw,240px);background:rgba(255,255,255,.88);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#kaartje svg{display:block;width:100%;height:auto}
#kaartje .wand{stroke:#17643f;stroke-width:3;fill:rgba(23,100,63,.08)}
#kaartje .stip{fill:#1c5fc4;opacity:.55;cursor:pointer}
#kaartje .ik{fill:#c4322a}
#kaartje .blik{stroke:#c4322a;stroke-width:2.5}
.onder{position:fixed;left:0;right:0;bottom:0;padding:10px max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:linear-gradient(transparent, rgba(0,0,0,.45))}
.onder button{min-width:52px;min-height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.6);background:rgba(20,30,24,.6);color:#fff;font-weight:650}
.onder button.aan{background:#17643f;border-color:#17643f}
@media (max-width:640px){ #hulp{top:auto!important;bottom:calc(140px + env(safe-area-inset-bottom, 0px));left:max(10px, env(safe-area-inset-left, 0px))} }
#hulp{position:fixed;right:max(10px, env(safe-area-inset-right, 0px));top:max(10px, env(safe-area-inset-top, 0px));max-width:280px;pointer-events:none;background:rgba(20,30,24,.7);color:#fff;border-radius:12px;padding:10px 12px;font-size:13px}
#foto{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#foto img{max-width:100%;max-height:82vh;border-radius:8px}
#foto p{color:#fff;margin:0}
</style>
</head>
<body>
<canvas id="beeld" aria-label="De opgenomen kamer in 3D"></canvas>

<div class="laden" id="laden">
  <div class="kaart">
    <h1>Rondkijken</h1>
    <p>Kies het bestand dat je op de telefoon met Bewaren of Delen hebt gemaakt. Op de telefoon zelf opent de laatste opname vanzelf.</p>
    <div class="melding" id="laden-melding" hidden></div>
    <label class="knop hoofd">Bestand kiezen<input type="file" id="bestand" accept=".json,application/json"></label>
  </div>
</div>

<div id="kaartje" hidden><svg id="kaart" role="img" aria-label="Plattegrond met de plekken waar beelden zijn gemaakt"></svg></div>
<div id="hulp" hidden>Slepen: rondkijken. Pijlen of WASD: lopen. Tik op een blauwe stip in de plattegrond om daar te gaan staan.</div>
<div class="onder" id="bediening" hidden>
  <button id="k-links" aria-label="Naar links draaien">⟲</button>
  <button id="k-vooruit" aria-label="Vooruit">▲</button>
  <button id="k-achter" aria-label="Achteruit">▼</button>
  <button id="k-rechts" aria-label="Naar rechts draaien">⟳</button>
  <button id="k-boven">Van boven</button>
  <button id="k-foto">Foto hier</button>
</div>
<div id="foto" hidden><img id="foto-img" alt="Vastgelegd beeld vanaf deze plek"><p id="foto-tekst"></p><button class="knop" id="k-foto-dicht">Sluiten</button></div>

<script>

  function draai(d) { if (cam.modus === 'binnen') cam.yaw += d; else cam.orbit.yaw -= d; later(); }
  var sleep = null;
  el('beeld').addEventListener('pointerdown', function (e) { el('hulp').hidden = true; sleep = { x: e.clientX, y: e.clientY }; try { el('beeld').setPointerCapture(e.pointerId); } catch (x) {} });
  el('beeld').addEventListener('pointermove', function (e) {
    if (!sleep) return;
    var dx = e.clientX - sleep.x, dy = e.clientY - sleep.y; sleep = { x: e.clientX, y: e.clientY };
    if (cam.modus === 'binnen') { cam.yaw -= dx * 0.005; cam.pitch = Math.max(-1.3, Math.min(1.3, cam.pitch + dy * 0.005)); }
    else { cam.orbit.yaw -= dx * 0.006; cam.orbit.pitch = Math.max(0.15, Math.min(1.5, cam.orbit.pitch + dy * 0.005)); }
    later();
  });
  ['pointerup', 'pointercancel'].forEach(function (t) { el('beeld').addEventListener(t, function () { sleep = null; }); });
  el('beeld').addEventListener('wheel', function (e) { e.preventDefault(); loop(e.deltaY < 0 ? 0.3 : -0.3); }, { passive: false });
  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') loop(0.2); else if (k === 'arrowdown' || k === 's') loop(-0.2);
    else if (k === 'arrowleft' || k === 'a') draai(0.08); else if (k === 'arrowright' || k === 'd') draai(-0.08);
    else if (k === 'escape') el('foto').hidden = true;
  });
  el('k-vooruit').addEventListener('click', function () { loop(0.3); });
  el('k-achter').addEventListener('click', function () { loop(-0.3); });
  el('k-links').addEventListener('click', function () { draai(0.25); });
  el('k-rechts').addEventListener('click', function () { draai(-0.25); });
  el('k-boven').addEventListener('click', function () {
    cam.modus = cam.modus === 'binnen' ? 'boven' : 'binnen';
    el('k-boven').classList.toggle('aan', cam.modus === 'boven'); el('k-boven').textContent = cam.modus === 'boven' ? 'Naar binnen' : 'Van boven'; later();
  });
  // Foto hier: het vastgelegde beeld dat het dichtst bij jouw plek en kijkrichting ligt
  el('k-foto').addEventListener('click', function () {
    var B = data.beelden || []; if (!B.length) return;
    var oog = camPos(), dir = cam.modus === 'binnen' ? [Math.sin(cam.yaw) * Math.cos(cam.pitch), Math.sin(cam.pitch), -Math.cos(cam.yaw) * Math.cos(cam.pitch)] : norm([cam.orbit.cx - oog[0], -0.3, cam.orbit.cz - oog[2]]);
    var best = -1, bs = Infinity;
    B.forEach(function (b, i) { var d = Math.hypot(b.pos[0] - oog[0], b.pos[2] - oog[2]), a = Math.acos(Math.max(-1, Math.min(1, dot(norm(b.dir), dir)))); var sc = d + a * 1.5; if (sc < bs) { bs = sc; best = i; } });
    var b = B[best]; el('foto-img').src = b.beeld; el('foto-tekst').textContent = 'Beeld ' + (best + 1) + ' van ' + B.length; el('foto').hidden = false;
  });
  el('k-foto-dicht').addEventListener('click', function () { el('foto').hidden = true; });
  window.addEventListener('resize', later);

  // ---------- inlezen ----------
  function fout(t) { el('laden').hidden = false; el('laden-melding').hidden = false; el('laden-melding').textContent = t; }
  el('bestand').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    f.text().then(function (t) { try { return laad(JSON.parse(t)); } catch (x) { fout('Openen lukte niet: ' + (x && x.message ? x.message : 'onbekend bestand') + '.'); } }, function () { fout('Het bestand kon niet worden gelezen.'); });
  });
  function uitIdb() {
    return new Promise(function (ok) {
      try {
        var rq = indexedDB.open('mt-ar', 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore('opnames'); };
        rq.onsuccess = function () { try { var g = rq.result.transaction('opnames').objectStore('opnames').get('laatste'); g.onsuccess = function () { ok(g.result || null); }; g.onerror = function () { ok(null); }; } catch (e) { ok(null); } };
        rq.onerror = function () { ok(null); };
      } catch (e) { ok(null); }
    });
  }
  uitIdb().then(function (obj) { if (obj) { try { laad(obj); } catch (e) { fout('De laatste opname op dit apparaat is niet te openen.'); } } });
  window.kijkProef = { laad: laad, cam: cam, teken: teken };
})();
</script>
