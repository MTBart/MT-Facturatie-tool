name = "mt-claude-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"

# Bewust GEEN [assets] / [site] — anders bundelt wrangler de hele repo-map
# (index.html etc.) als statische assets en faalt op grootte. Dit is een
# pure module-worker: alleen worker.js. Secrets (CLAUDE_KEY, CLAUDE_SECRET,
# MONEYBIRD_KEY, TOGGL_KEY, TOGGL_FOCUS_KEY) staan al via `wrangler secret put`
# in Cloudflare en blijven bij deploy behouden — niet hier zetten.
#
# F1 per-user Toggl-tokens (optioneel, fallback = gedeelde keys hierboven):
#   wrangler secret put TOGGL_KEY_BART / TOGGL_KEY_ARJAN / TOGGL_KEY_MATHIJS /
#   TOGGL_KEY_MAARTEN en idem TOGGL_FOCUS_KEY_<NAAM>.
#   Naam = e-mailprefix in hoofdletters (bart@mortiseandtenon.nl → BART).
#   toggl_reports blijft altijd op het admin-TOGGL_KEY (aggregatie).
#
# ─── Usage-/presence-tracking (D1 + KV) ───────────────────────────────────────
# VOORSTEL — Bart vult de id's in NA de creates en haalt dan de # weg.
# Zolang dit uitgecommentarieerd staat, faalt de Worker NIET (de /track-routes
# detecteren ontbrekende bindings en slaan stil over). Uitrol-stappen staan in
# TRACKING.md. NIET door Claude uitgevoerd — Bart draait de creates zelf.
#
# 1) D1-database:
#      wrangler d1 create mt-tracking
#    → kopieer de geprinte database_id hieronder.
#
# 2) KV-namespace (presence):
#      wrangler kv namespace create TRACK_KV
#    → kopieer de geprinte id hieronder.
#
# Aangemaakt + ingevuld door Larry 2026-06-14 (Bart-akkoord voor deploy).

[[d1_databases]]
binding = "TRACK_DB"
database_name = "mt-tracking"
database_id = "ad68c685-d15b-403e-882f-232ed594691c"

[[kv_namespaces]]
binding = "TRACK_KV"
id = "c2ccdda50c59470d99ca885acecaff20"

# ─── Rollen (F1a): KV MT_ROLLEN + modus + eigenaar ────────────────────────────
# Zonder deze binding werkt de Worker door (iedereen "onbekend", eigenaar via
# OWNER_OID blijft eigenaar, /beheer geeft 503). Stappen (Bart, eenmalig):
#
# 1) KV-namespace aanmaken:
#      wrangler kv namespace create MT_ROLLEN
#    → zet de geprinte id hieronder i.p.v. VUL_IN en haal de # weg.
#      (een namespace-id is geen geheim; tokens/secrets horen hier NIET)
#
[[kv_namespaces]]
binding = "MT_ROLLEN"
id = "f1405a729e4e4f1985c98ad12b194fa2"
#
# 2) Vaste eigenaren (niet in de repo — als secret; komma-gescheiden lijsten):
#      wrangler secret put OWNER_OIDS     ← Entra Object ID's (oid), bv. "<oid1>,<oid2>"
#      wrangler secret put OWNER_EMAILS   ← voor wie z'n oid nog niet bekend is (e-mail)
#    Een vaste eigenaar is altijd Eigenaar en via Beheer niet te wijzigen. Via e-mail wordt
#    bij de eerste login de oid vastgelegd (Beheer toont hem) → later naar OWNER_OIDS.
#    (OWNER_OID / OWNER_EMAIL enkelvoud werken ook nog.)
#
# 3) Versleuteling van zelf gekoppelde Toggl-sleutels (F1e): 32 willekeurige bytes, base64:
#      node -e "console.log(require('crypto').randomBytes(32).toString('base64'))" | wrangler secret put SLEUTEL_KEK
#    Zonder SLEUTEL_KEK kan niemand z'n Toggl koppelen (nooit onversleuteld opgeslagen).
#    Roteren: nieuwe waarde als SLEUTEL_KEK en de oude als SLEUTEL_KEK_VORIG (records worden bij
#    gebruik herversleuteld; na een paar weken VORIG weghalen). Kwijt = iedereen koppelt opnieuw.
#
# 4) Modus: 'uit' | 'log' (eerst ±1 week) | 'afdwingen'. Wijzigen = hier aanpassen + deploy.
# ─── Idempotente Moneybird-acties (F4): Durable Object MT_ACTIES ───────────────
# Maakt "dezelfde actie maar één keer" atomair, ook over datacenters heen (KV alleen is
# eventually consistent). Werkt op het gratis plan (SQLite-DO). Zonder deze binding valt de
# worker terug op KV + geheugen. Geeft de deploy een fout over Durable Objects: dit blok tijdelijk
# uitzetten (#) — de rest werkt dan gewoon door.
[[durable_objects.bindings]]
name = "MT_ACTIES"
class_name = "MtActies"

[[migrations]]
tag = "v1-mt-acties"
new_sqlite_classes = ["MtActies"]

# ─── Werkcode-teller (projectnummering): Durable Object MT_TELLER ──────────────
# Eén object geeft de werkcodes W<jj>-<nnn> uit: atomair, idempotent per project_id, nooit
# hergebruikt. Zonder deze binding geven /teller/* een 503 (bewust geen KV-terugval) en blijven
# nieuwe projecten zonder werkcode tot de binding er is (de cockpit probeert het later opnieuw).
[[durable_objects.bindings]]
name = "MT_TELLER"
class_name = "MtTeller"

[[migrations]]
tag = "v2-mt-teller"
new_sqlite_classes = ["MtTeller"]

# ─── Klantenlijst (F5): Durable Object MT_KLANTEN ──────────────────────────────
# Serialiseert de writes op KV `klanten:registry` en doet het compare-and-set op `rev` (KV heeft geen CAS). Zonder deze
# binding geeft POST /klanten een 503 (GET werkt gewoon uit KV).
[[durable_objects.bindings]]
name = "MT_KLANTEN"
class_name = "MtKlanten"

[[migrations]]
tag = "v3-mt-klanten"
new_sqlite_classes = ["MtKlanten"]

# ─── Koersmeter: dagclaim (Durable Object MT_KOERSDAG) ─────────────────────────────
# Maakt de ochtendrun atomair: één run per dag (bezig / klaar / mislukt, max. 3 pogingen). Zonder deze binding doet de
# cron niets (liever geen dagfoto dan twee).
[[durable_objects.bindings]]
name = "MT_KOERSDAG"
class_name = "MtKoersDag"

[[migrations]]
tag = "v4-mt-koersdag"
new_sqlite_classes = ["MtKoersDag"]

# ─── Zoekbalk: index-claim (Durable Object MT_ZOEKINDEX) ──────────────────────────
# Maakt "één opbouw van de Moneybird-zoekindex tegelijk" atomair (een KV-slot is dat niet). Zonder deze binding valt de worker terug op een KV-slot.
[[durable_objects.bindings]]
name = "MT_ZOEKINDEX"
class_name = "MtZoekIndex"

[[migrations]]
tag = "v5-mt-zoekindex"
new_sqlite_classes = ["MtZoekIndex"]

# ─── Koersmeter: ochtendrun (Cron Triggers staan in UTC) ───────────────────────
# Het werk begint om 07:00: de melding moet dan klaar zijn. Elke 30 minuten van 03:00 tot 05:30 UTC. De code kijkt naar de lokale tijd in
# Europe/Amsterdam: 04:00-05:30 vult alleen de caches (tijdlijn + maandcijfers), 05:30-07:00 is de eigenlijke run (poging 1 om 05:30, 2 om 06:00,
# 3 om 06:30; zomer 03:30/04:00/04:30 UTC, winter 04:30/05:00/05:30 UTC), de dag nog niet klaar en minder dan 3 pogingen. Daarna doet niets meer mee.
# Signalen (L3): de dagelijkse controle op gemiste Moneybird-webhooks heeft een EIGEN expressie (45 4 * * * = 05:45/06:45 Amsterdam);
# worker.js stuurt alleen die expressie naar sigReconciliatie (eigen budget van 30 subrequests), de rest blijft bij de Koersmeter.
# Wijzig je hem hier, wijzig dan ook SIG_REC_CRON in worker.js.
[triggers]
crons = ["*/30 3-5 * * *", "45 4 * * *"]

# ─── Signalen (L3) en web-push (L3b): secrets (NIET door Claude gezet; Bart/regie, eenmalig) ───────────────
# Opslag: de bestaande DO MT_TELLER (instantie 'signalen') → geen nieuwe binding of migratie nodig.
# Zet secrets ALTIJD via Git Bash met printf (een PowerShell-pipe zet er een BOM voor):
#
# 1) Moneybird-webhook: het geheim krijg je alleen bij het aanmaken van de webhook (veld "secret" in het antwoord van
#    POST /api/v2/<administratie>/webhooks.json, of in Moneybird na MFA). Webhook: url https://mt-claude-proxy.bart-a12.workers.dev/mb/webhook,
#    enabled_events ["estimate_mark_accepted", "estimate_mark_rejected", "estimate_accepted_contact", "estimate_signed_sender",
#    "estimate_state_changed_to_late"]. Pas aanmaken NA de deploy van deze worker (anders weigert hij alles met 503).
#      printf %s '<secret>' | npx wrangler secret put MB_WEBHOOK_SECRET
#    Roteren: het nieuwe geheim als MB_WEBHOOK_SECRET, het oude tijdelijk als MB_WEBHOOK_SECRET_VORIG (daarna weghalen).
#
# 2) VAPID-sleutels voor push (één keer; de publieke sleutel is niet geheim, de private wel):
#      node -e "const c=require('crypto');const j=c.generateKeyPairSync('ec',{namedCurve:'prime256v1'}).privateKey.export({format:'jwk'});console.log(Buffer.concat([Buffer.from([4]),Buffer.from(j.x,'base64url'),Buffer.from(j.y,'base64url')]).toString('base64url'));console.log(j.d)"
#    Regel 1 = publiek, regel 2 = privé (niet bewaren in de repo of een chat):
#      printf %s '<regel 1>' | npx wrangler secret put VAPID_PUBLIC
#      printf %s '<regel 2>' | npx wrangler secret put VAPID_PRIVATE
#    Optioneel: VAPID_SUBJECT = https://… of mailto:… (standaard https://mortiseandtenon.nl). Sleutels vervangen = iedereen meldt opnieuw aan.
[vars]
ROLLEN_MODUS = "log"
# F2–F4: proxy-contract + bevestiging bij Moneybird-writes. Eerst "log", later "afdwingen".
PROXY_MODUS = "log"
# F6: AI-limieten per gebruiker (tokens per dag, verzoeken per minuut, gelijktijdig, plus een dagplafond voor de hele tool). Zonder deze
# variabele geldt "afdwingen" (429 met uitleg); "log" telt en logt alleen wat geweigerd zou worden; "uit" doet niets. De waarden zelf
# staan in worker.js (AI_LIMIET_STD) en zijn door de eigenaar aan te passen via POST /beheer/ai-limieten (KV instelling:ai_limieten).
# Eerste week op "log" (tot ±18-10), zodat niemand plotseling geblokkeerd wordt en /beheer/ai laat zien wat er geweigerd zou worden; daarna "afdwingen" (of de regel weghalen).
AI_LIMIET_MODUS = "log"
