name = "mt-claude-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"

# Bewust GEEN [assets] / [site] — anders bundelt wrangler de hele repo-map
# (index.html etc.) als statische assets en faalt op grootte. Dit is een
# pure module-worker: alleen worker.js. Secrets (CLAUDE_KEY, CLAUDE_SECRET,
# MONEYBIRD_KEY, TOGGL_KEY, TOGGL_FOCUS_KEY) staan al via `wrangler secret put`
# in Cloudflare en blijven bij deploy behouden — niet hier zetten.
#
# F1 per-user Toggl-tokens (optioneel, fallback = gedeelde keys hierboven):
#   wrangler secret put TOGGL_KEY_BART / TOGGL_KEY_ARJAN / TOGGL_KEY_MATHIJS /
#   TOGGL_KEY_MAARTEN en idem TOGGL_FOCUS_KEY_<NAAM>.
#   Naam = e-mailprefix in hoofdletters (bart@mortiseandtenon.nl → BART).
#   toggl_reports blijft altijd op het admin-TOGGL_KEY (aggregatie).
