name = "mt-claude-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"

# Bewust GEEN [assets] / [site] — anders bundelt wrangler de hele repo-map
# (index.html etc.) als statische assets en faalt op grootte. Dit is een
# pure module-worker: alleen worker.js. Secrets (CLAUDE_KEY, CLAUDE_SECRET,
# MONEYBIRD_KEY, TOGGL_KEY, TOGGL_FOCUS_KEY) staan al via `wrangler secret put`
# in Cloudflare en blijven bij deploy behouden — niet hier zetten.
#
# F1 per-user Toggl-tokens (optioneel, fallback = gedeelde keys hierboven):
#   wrangler secret put TOGGL_KEY_BART / TOGGL_KEY_ARJAN / TOGGL_KEY_MATHIJS /
#   TOGGL_KEY_MAARTEN en idem TOGGL_FOCUS_KEY_<NAAM>.
#   Naam = e-mailprefix in hoofdletters (bart@mortiseandtenon.nl → BART).
#   toggl_reports blijft altijd op het admin-TOGGL_KEY (aggregatie).
#
# ─── Usage-/presence-tracking (D1 + KV) ───────────────────────────────────────
# VOORSTEL — Bart vult de id's in NA de creates en haalt dan de # weg.
# Zolang dit uitgecommentarieerd staat, faalt de Worker NIET (de /track-routes
# detecteren ontbrekende bindings en slaan stil over). Uitrol-stappen staan in
# TRACKING.md. NIET door Claude uitgevoerd — Bart draait de creates zelf.
#
# 1) D1-database:
#      wrangler d1 create mt-tracking
#    → kopieer de geprinte database_id hieronder.
#
# 2) KV-namespace (presence):
#      wrangler kv namespace create TRACK_KV
#    → kopieer de geprinte id hieronder.
#
# Aangemaakt + ingevuld door Larry 2026-06-14 (Bart-akkoord voor deploy).

[[d1_databases]]
binding = "TRACK_DB"
database_name = "mt-tracking"
database_id = "ad68c685-d15b-403e-882f-232ed594691c"

[[kv_namespaces]]
binding = "TRACK_KV"
id = "c2ccdda50c59470d99ca885acecaff20"

# ─── Rollen (F1a): KV MT_ROLLEN + modus + eigenaar ────────────────────────────
# Zonder deze binding werkt de Worker door (iedereen "onbekend", eigenaar via
# OWNER_OID blijft eigenaar, /beheer geeft 503). Stappen (Bart, eenmalig):
#
# 1) KV-namespace aanmaken:
#      wrangler kv namespace create MT_ROLLEN
#    → zet de geprinte id hieronder i.p.v. VUL_IN en haal de # weg.
#      (een namespace-id is geen geheim; tokens/secrets horen hier NIET)
#
[[kv_namespaces]]
binding = "MT_ROLLEN"
id = "f1405a729e4e4f1985c98ad12b194fa2"
#
# 2) Vaste eigenaren (niet in de repo — als secret; komma-gescheiden lijsten):
#      wrangler secret put OWNER_OIDS     ← Entra Object ID's (oid), bv. "<oid1>,<oid2>"
#      wrangler secret put OWNER_EMAILS   ← voor wie z'n oid nog niet bekend is (e-mail)
#    Een vaste eigenaar is altijd Eigenaar en via Beheer niet te wijzigen. Via e-mail wordt
#    bij de eerste login de oid vastgelegd (Beheer toont hem) → later naar OWNER_OIDS.
#    (OWNER_OID / OWNER_EMAIL enkelvoud werken ook nog.)
#
# 3) Versleuteling van zelf gekoppelde Toggl-sleutels (F1e): 32 willekeurige bytes, base64:
#      node -e "console.log(require('crypto').randomBytes(32).toString('base64'))" | wrangler secret put SLEUTEL_KEK
#    Zonder SLEUTEL_KEK kan niemand z'n Toggl koppelen (nooit onversleuteld opgeslagen).
#    Roteren: nieuwe waarde als SLEUTEL_KEK en de oude als SLEUTEL_KEK_VORIG (records worden bij
#    gebruik herversleuteld; na een paar weken VORIG weghalen). Kwijt = iedereen koppelt opnieuw.
#
# 4) Modus: 'uit' | 'log' (eerst ±1 week) | 'afdwingen'. Wijzigen = hier aanpassen + deploy.
# ─── Idempotente Moneybird-acties (F4): Durable Object MT_ACTIES ───────────────
# Maakt "dezelfde actie maar één keer" atomair, ook over datacenters heen (KV alleen is
# eventually consistent). Werkt op het gratis plan (SQLite-DO). Zonder deze binding valt de
# worker terug op KV + geheugen. Geeft de deploy een fout over Durable Objects: dit blok tijdelijk
# uitzetten (#) — de rest werkt dan gewoon door.
[[durable_objects.bindings]]
name = "MT_ACTIES"
class_name = "MtActies"

[[migrations]]
tag = "v1-mt-acties"
new_sqlite_classes = ["MtActies"]

[vars]
ROLLEN_MODUS = "log"
# F2–F4: proxy-contract + bevestiging bij Moneybird-writes. Eerst "log", later "afdwingen".
PROXY_MODUS = "log"
